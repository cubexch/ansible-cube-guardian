---
- name: Copy root certificate to guardian
  ansible.builtin.copy:
    src: certs/cube.root_ca.crt
    dest: /usr/local/share/ca-certificates/cube.root_ca.crt
    owner: root
    group: root
    mode: '0644'
  tags:
    - guardian_certificates
  notify:
    - Update CA certificates

## N.B: Flush handlers asap just in case the root certificate has been added
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Request new certificate from Cube CA
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      --standalone
      --non-interactive
      --server https://{{ cuba_ca_fqdn }}/acme/{{ step_ca_acme_provisioner_name }}/directory
      --domain {{ guardian_instance.public_fqdn }}
      --email {{ certbot_admin_email }}
      --agree-tos
    creates: /etc/letsencrypt/live/{{ guardian_instance.public_fqdn }}/cert.pem
  tags:
    - guardian_certificates

- name: Deploy certbot renew hook script
  ansible.builtin.template:
    src: certbot-renewal-instance.sh.j2
    dest: "{{ guardian_dirs.install }}/current/certbot-renewal-{{ guardian_instance.public_fqdn }}.sh"
    owner: "{{ guardian_user.name }}"
    group: "{{ guardian_user.group }}"
    mode: u=rwx,g=rx,o=-
  when: deploy_certbot_renewal_hook | default(false) | bool
  tags:
    - guardian_certificates

- name: Configure certbot renew hook
  community.general.ini_file:
    path: /etc/letsencrypt/renewal/{{ guardian_instance.public_fqdn }}.conf
    section: renewalparams
    option: renew_hook
    value: "{{ guardian_dirs.install }}/current/certbot-renewal-{{ guardian_instance.public_fqdn }}.sh"
  when: deploy_certbot_renewal_hook | default(false) | bool
  tags:
    - guardian_certificates

- name: Copy Remote Guardian Certificates to Config Dir
  no_log: true
  ansible.builtin.copy:
    src: "{{ guardian_certificates.remote_path }}/{{ item }}"
    remote_src: true
    dest: "{{ guardian_dirs.config }}/{{ item }}"
    owner: "{{ guardian_user.name }}"
    group: "{{ guardian_user.group }}"
    mode: u=rw,go=-
  with_items:
    - "{{ guardian_certificates.tls_private_key_name }}"
    - "{{ guardian_certificates.tls_certificate_name }}"
    - "{{ guardian_certificates.tls_root_certificate_name }}"
  tags:
    - molecule-notest
    - guardian_certificates
  notify:
    - Restart guardian service

- name: Request new certificate from Let's encrypt for web
  ansible.builtin.command:
    cmd: >-
      certbot certonly
      --standalone
      --non-interactive
      --cert-name web-{{ guardian_instance.public_fqdn }}
      --domain {{ guardian_instance.public_fqdn }}
      --email {{ certbot_admin_email }}
      --agree-tos
    creates: /etc/letsencrypt/live/web-{{ guardian_instance.public_fqdn }}/cert.pem
  tags:
    - guardian_certificates

- name: Deploy web certbot renew hook script
  ansible.builtin.template:
    src: web-certbot-renewal-instance.sh.j2
    dest: "{{ guardian_dirs.install }}/current/web-certbot-renewal-{{ guardian_instance.public_fqdn }}.sh"
    owner: "{{ guardian_user.name }}"
    group: "{{ guardian_user.group }}"
    mode: u=rwx,g=rx,o=-
  when: deploy_certbot_renewal_hook | default(false) | bool
  tags:
    - guardian_certificates

- name: Configure web certbot renew hook
  community.general.ini_file:
    path: /etc/letsencrypt/renewal/web-{{ guardian_instance.public_fqdn }}.conf
    section: renewalparams
    option: renew_hook
    value: "{{ guardian_dirs.install }}/current/web-certbot-renewal-{{ guardian_instance.public_fqdn }}.sh"
  when: deploy_certbot_renewal_hook | default(false) | bool
  tags:
    - guardian_certificates

- name: Copy Remote web Guardian Certificates to Config Dir
  no_log: true
  ansible.builtin.copy:
    src: /etc/letsencrypt/live/web-{{ guardian_instance.public_fqdn }}/{{ item }}
    remote_src: true
    dest: "{{ guardian_dirs.config }}/web-{{ item }}"
    owner: "{{ guardian_user.name }}"
    group: "{{ guardian_user.group }}"
    mode: u=rw,go=-
  loop:
    - fullchain.pem
    - privkey.pem
  tags:
    - molecule-notest
    - guardian_certificates
  notify:
    - Restart guardian service
